server.port=${PORT:8081}

# Database configuration - Spring Boot will auto-detect from DATABASE_URL
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/voting_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Babulkumar@2004}

# Explicit driver and dialect configuration
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.database-platform=${DATABASE_DIALECT:org.hibernate.dialect.MySQLDialect}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT configuration
jwt.secret=${JWT_SECRET:verysecretkey123456}

# Vote encryption
vote.encryption.secret=${ENCRYPTION_SECRET:0123456789abcdef}
vote.encryption.iv=${ENCRYPTION_IV:fedcba9876543210}
